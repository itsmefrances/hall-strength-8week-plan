name: Sync Concept2 results

on:
  schedule:
    # Every 6 hours — a workout synced from ErgData shows up on the site
    # within a few hours of finishing it.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and match Concept2 results
        env:
          C2_CLIENT_ID: ${{ secrets.C2_CLIENT_ID }}
          C2_CLIENT_SECRET: ${{ secrets.C2_CLIENT_SECRET }}
          C2_REFRESH_TOKEN: ${{ secrets.C2_REFRESH_TOKEN }}
        run: python3 scripts/sync_concept2.py

      # Concept2 may issue a new refresh token on each refresh. Persist it so
      # the next run still works. Requires ACTIONS_PAT, a fine-grained PAT for
      # this repo with "Secrets" read/write permission.
      - name: Rotate refresh token secret
        if: ${{ hashFiles('.c2_new_refresh_token') != '' }}
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set C2_REFRESH_TOKEN --repo "${{ github.repository }}" < .c2_new_refresh_token
            echo "Updated C2_REFRESH_TOKEN secret."
          else
            echo "::warning::Concept2 rotated the refresh token but ACTIONS_PAT is not set — the next run may fail. Add an ACTIONS_PAT secret (fine-grained PAT with Secrets read/write) or re-run scripts/concept2_auth.py."
          fi
          rm -f .c2_new_refresh_token

      - name: Commit updated results
        run: |
          if [ -n "$(git status --porcelain data/results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/results.json
            git commit -m "Sync Concept2 results"
            git push
          else
            echo "No changes to results.json"
          fi
