name: Instagram news bot

on:
  schedule:
    # Every 10 minutes. GitHub cron is best-effort and may lag a few minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build captions/graphics, do not publish)"
        type: boolean
        default: false

concurrency:
  group: newsbot
  cancel-in-progress: false

permissions:
  contents: write   # push generated graphics + state db back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: newsbot/requirements.txt

      - name: Install dependencies
        run: pip install -r newsbot/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s newsbot/tests -t .

      - name: Run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python -m newsbot

      - name: Commit state
        run: |
          git config user.name "newsbot"
          git config user.email "actions@users.noreply.github.com"
          git add newsbot/state
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "newsbot: update state [skip ci]"
          # The bot may have pushed image commits mid-run via the API; rebase over them.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
